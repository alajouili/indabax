[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-decision"
version = "0.1.0"
description = "SENTINEL Part 3 risk scoring, decision, human validation, enforcement and trace logging"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sentinel-decision = "sentinel_decision.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel_decision*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
