[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-part1-verifier"
version = "0.1.0"
description = "Deterministic structural verifier for the SENTINEL AI-agent security pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["sentinel_verifier"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
